<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />

  <link rel="canonical" href="https://ikaptritourismfair.com/pengunjung" />

  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16.png" />
  <link rel="apple-touch-icon" href="/assets/images/favicon-180.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#0e4182" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="IKAPTRI Tourism Fair 2027" />
  <meta property="og:title" content="Pengunjung — IKAPTRI Tourism Fair 2027" />
  <meta property="og:description" content="Kunjungi IKAPTRI Tourism Fair 2027, terbuka untuk umum! 5 zona eksplorasi mulai dari exhibition, workshop, business matching, hingga gala dinner." />
  <meta property="og:url" content="https://ikaptritourismfair.com/pengunjung" />
  <meta property="og:image" content="https://ikaptritourismfair.com/assets/images/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="id_ID" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Pengunjung — IKAPTRI Tourism Fair 2027" />
  <meta name="twitter:description" content="Kunjungi IKAPTRI Tourism Fair 2027, terbuka untuk umum! 5 zona eksplorasi mulai dari exhibition, workshop, business matching, hingga gala dinner." />
  <meta name="twitter:image" content="https://ikaptritourismfair.com/assets/images/og-image.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ============================== TOP BAR ============================== -->
  <div class="topbar">
    <a href="index.html" class="topbar__logo">
      <img src="assets/images/logo.png" alt="IKAPTRI Tourism Fair 2027" />
    </a>
    <div class="topbar__partners">
      <div class="partner-group">
        <span class="partner-group__label">Diselenggarakan Oleh:</span>
        <div class="partner-group__logos">
          <img src="assets/images/diselenggarakan-logos.png" alt="Institut Pariwisata Trisakti & IKAPTRI" />
        </div>
      </div>
      <div class="partner-group">
        <span class="partner-group__label">Pelaksana:</span>
        <div class="partner-group__logos">
          <img src="assets/images/pelaksana-logos.png" alt="Enhaiier Corporation & Satu Matahari" />
        </div>
      </div>
    </div>
  </div>

  <!-- ============================== NAVBAR ============================== -->
  <header class="navbar">
    <button class="navbar__toggle" data-nav-toggle aria-label="Buka menu">&#9776;</button>
    <ul class="navbar__list" data-nav-list>
      <li><a href="index.html">BERANDA</a></li>
      <li><a href="eksibitor.html">EKSIBITOR</a></li>
      <li><a href="pengunjung.html" class="is-active">PENGUNJUNG</a></li>
      <li><a href="program.html">PROGRAM</a></li>
      <li><a href="media.html">MEDIA</a></li>
    </ul>
    <a href="registrasi.html" class="navbar__cta">REGISTRASI PESERTA</a>
  </header>

  <h1 style="text-align:center;font-size:34px;font-weight:800;color:var(--navy-deep);padding:44px 0 0">PENGUNJUNG</h1>

  <!-- ============================== TERBUKA UNTUK UMUM (banner) ============================== -->
  <section class="pengunjung-banner" style="background-image:url('assets/images/pengunjung-banner.jpg')"></section>

  <!-- ============================== 5 EXPERIENCE ZONES ============================== -->
  <div class="zones-intro">
    <h3>5 Zona Eksplorasi</h3>
    <p>1 Perjalanan Luar Biasa</p>
  </div>

  <section class="zones-wrap container">
    <div class="zones-slider">
      <button class="zones-slider__nav zones-slider__nav--prev" data-zones-prev aria-label="Zone sebelumnya">&#8249;</button>
      <div class="zones-slider__viewport">
        <div class="zones-slider__track" data-experience-zones></div>
      </div>
      <button class="zones-slider__nav zones-slider__nav--next" data-zones-next aria-label="Zone berikutnya">&#8250;</button>
    </div>
    <div class="zones-dots" data-zones-dots></div>
  </section>

  <div class="section-frame">
    <img src="assets/images/hero-frame.png" alt="" />
  </div>

  <!-- ============================== VENUE + MAP ============================== -->
  <section class="map-section container">
    <div class="map-section__grid">
      <div class="map-section__venue">
        <img src="assets/images/venue.jpg" alt="ARTOTEL Gelora Senayan" />
      </div>
      <div class="map-section__map">
        <iframe
          src="https://maps.google.com/maps?q=Artotel%20Gelora%20Senayan%20Jakarta&t=&z=15&ie=UTF8&iwloc=&output=embed"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          title="Lokasi ARTOTEL Gelora Senayan"
        ></iframe>
        <a
          class="map-section__fallback-link"
          href="https://www.google.com/maps/search/?api=1&query=Artotel+Gelora+Senayan+Jakarta"
          target="_blank"
          rel="noopener"
        >Buka di Google Maps &#8599;</a>
      </div>
    </div>
  </section>

  <div class="section-frame section-frame--flip">
    <img src="assets/images/hero-frame.png" alt="" />
  </div>

  <!-- ============================== DATE / VENUE / HOURS ============================== -->
  <section class="event-meta container">
    <div class="event-meta__row">
      <div class="event-meta__item">
        <div class="event-meta__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
        </div>
        <div>
          <strong data-pengunjung-date></strong>
        </div>
      </div>
      <div class="event-meta__item">
        <div class="event-meta__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        <div>
          <span data-pengunjung-venue></span>
        </div>
      </div>
    </div>
    <div class="event-meta__hours" data-pengunjung-hours></div>
  </section>

  <!-- ============================== FOOTER ============================== -->
  <footer class="footer">
    <div class="container footer__grid">
      <div>
        <h3 class="footer__title">Contact Person</h3>
        <div data-contact-list></div>
      </div>
      <div>
        <div class="footer__org-label">Organized by:</div>
        <img src="assets/images/satu-matahari-white.png" alt="Satu Matahari" style="height:52px;margin-bottom:24px" />
        <h3 class="footer__office-title">Office</h3>
        <p data-office-address></p>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/data.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
